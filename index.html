<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Kairos</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kairos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#17202b;--muted:#5d6b7c;--line:#dfe4ea;--accent:#1f5f99;--accent-ink:#fff;
  --ok:#2e7d4f;--warn:#b26b00;--bad:#b3261e;--chip:#eef2f6;
  --t-rest:#e4e6ea;--t-recovery:#d6e8f7;--t-endurance:#cfe8c0;--t-long:#a9d08e;--t-cross:#ddd5ee;--t-openers:#ffe699;
  --t-tempo:#f8cbad;--t-hard:#f4a6a6;--t-race:#c00000;--t-camphard:#7030a0;--t-campend:#c3b6e2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--muted:#9aa8b8;--line:#2a3542;--accent:#6aa9e9;--accent-ink:#0f141a;
  --ok:#6cc58f;--warn:#e0a640;--bad:#ff7b72;--chip:#222c38;
  --t-rest:#3a414b;--t-recovery:#2b4560;--t-endurance:#35552c;--t-long:#4d7339;--t-cross:#4a3f63;--t-openers:#6b5a1c;
  --t-tempo:#7a4a33;--t-hard:#7d3434;--t-race:#c00000;--t-camphard:#7030a0;--t-campend:#4f4570;
}}
:root[data-theme="dark"]{
  --bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--muted:#9aa8b8;--line:#2a3542;--accent:#6aa9e9;--accent-ink:#0f141a;
  --ok:#6cc58f;--warn:#e0a640;--bad:#ff7b72;--chip:#222c38;
  --t-rest:#3a414b;--t-recovery:#2b4560;--t-endurance:#35552c;--t-long:#4d7339;--t-cross:#4a3f63;--t-openers:#6b5a1c;
  --t-tempo:#7a4a33;--t-hard:#7d3434;--t-race:#c00000;--t-camphard:#7030a0;--t-campend:#4f4570;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:980px;margin:0 auto}
.bar .head{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.brand img{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.brand b{display:block;font-size:19px;letter-spacing:.06em;line-height:1.1}
.brand .ver{font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted)}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:980px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
main{max-width:980px;margin:0 auto;padding:14px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kv{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:4px 10px}
.kv div:nth-child(odd){color:var(--muted)}
.big{font-size:26px;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink);background:var(--t-rest)}
.t-Rest{background:var(--t-rest)}.t-Recovery{background:var(--t-recovery)}.t-Endurance{background:var(--t-endurance)}.t-Long{background:var(--t-long)}
.t-Cross-training{background:var(--t-cross)}.t-Openers{background:var(--t-openers)}.t-Tempo{background:var(--t-tempo)}.t-Hard{background:var(--t-hard)}
.t-Race{background:var(--t-race);color:#fff}.t-Camp-hard{background:var(--t-camphard);color:#fff}.t-Camp-endurance{background:var(--t-campend)}
.note{border-left:3px solid var(--accent);padding:6px 10px;background:var(--chip);border-radius:6px;margin:6px 0;font-size:14px}
.note.warn{border-color:var(--warn)}.note.bad{border-color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.scroll{overflow-x:auto}
.day{border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.day.today{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;padding:10px 8px}
.day.past{opacity:.6}
.day .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day .detail{display:none;margin-top:8px}.day.open .detail{display:block}
.week{margin:16px 0 4px;font-weight:600;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}
legend{color:var(--muted);font-size:13px;padding:0 6px}
details summary{cursor:pointer;color:var(--accent);margin:6px 0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;max-width:92vw;z-index:20}
.status{font-size:12px;color:var(--muted);padding:0 16px 6px;max-width:980px;margin:0 auto}
canvas{max-height:260px}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 8px;font-size:12px;margin:2px 2px 0 0}
.wcard{border-bottom:1px solid var(--line);padding:10px 0}
@media (max-width:520px){.kv{grid-template-columns:1fr 1fr}.big{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="head">
      <div class="brand"><img src="icon.svg" alt=""><div><b>KAIROS <span class="ver" id="ver"></span></b><small>This is the moment.</small></div></div>
      <h1 id="title"></h1>
    </div>
    <div class="seg" id="who"></div>
  </div>
  <nav id="tabs"></nav>
  <div class="status" id="status"></div>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
"use strict";
/* ------------------------------------------------------------------ config + state */
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* unsaved form input survives switching tabs or closing the app, per form, on this device only */
function keepDraft(f,key,skip=[]){
  const k="draft:"+S.who+":"+key;const d=LS.get(k,null);
  const fill=()=>{if(!d)return;Object.entries(d).forEach(([n,v])=>{const el=f.elements[n];if(!el||skip.includes(n)||el.type==="submit")return;if(el.type==="checkbox")el.checked=!!v;else el.value=v})};
  fill();
  if(d){f.insertAdjacentHTML("afterbegin",`<div class="note small">Restored what you typed earlier and haven't saved yet. <a href="#" class="draftdrop">Discard it</a></div>`);
    f.querySelector(".draftdrop").onclick=e=>{e.preventDefault();clear();render()}}
  const save=()=>{const o={};[...f.elements].forEach(el=>{if(el.name&&!skip.includes(el.name))o[el.name]=el.type==="checkbox"?el.checked:el.value});LS.set(k,o)};
  f.addEventListener("input",save);f.addEventListener("change",save);
  const clear=()=>{try{localStorage.removeItem(k)}catch(e){}};
  return {clear,restored:!!d}}
const TABS_ALL=[["today","Today"],["plan","Plan"],["log","Morning log"],["acts","Activities"],["trends","Trends"],["model","Model"],["workouts","Workouts"],["settings","Settings"],["account","Account"]];
const MASTER_ONLY=["model","workouts","settings"];
// master view: the master's own pages, or another rider's with "Master view" on; "Rider's view" shows that rider's app as they see it
const masterView=()=>S.master&&!(LS.get("asrider",false)&&S.who!==S.me);
const tabs=()=>TABS_ALL.filter(([k])=>masterView()?k!=="account":!MASTER_ONLY.includes(k));
/* Each person's data lives in their own private repository. A token only reaches the repositories it was
   given access to, so GitHub itself decides who sees what: a token with access to more than one of these
   repositories is a master login (sees everyone), a token with access to one repository is a normal login. */
const PEOPLE=[{id:"mike",name:"Mike",repo:"TrainingModel-Mike"},{id:"vivi",name:"Vivi",repo:"TrainingModel-Vivi"}];
const MASTER="mike";
/* The model code and every rider's settings live in this repository. Only the master token can open it, so only the
   master sees the Model, Workouts and Settings tabs and can change settings. */
const CODE_REPO="TrainingModel";
const APP_VERSION="1.3.4"; // this file's version; the header shows the model's (VERSION in TrainingModel) once loaded
const S={conn:LS.get("conn",null),athletes:LS.get("athletes",[]),master:LS.get("master",false),me:LS.get("me",null),who:LS.get("who",null),tab:LS.get("tab","today"),out:{},charts:[]};
if(S.conn&&!S.athletes.length)S.conn=null;
if(!S.athletes.includes(S.who))S.who=S.me||S.athletes[0]||null;
const repoOf=who=>(PEOPLE.find(p=>p.id===who)||{}).repo;
const cap=a=>a?a[0].toUpperCase()+a.slice(1):"";
const $=s=>document.querySelector(s);
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,d=0)=>v==null||v===""||isNaN(v)?"–":Number(v).toFixed(d);
const pct=(v,d=0,sign=false)=>v==null?"–":(sign&&v>0?"+":"")+(v*100).toFixed(d)+"%";
const tcls=t=>"t-"+String(t||"Rest").replace(/ /g,"-");
const badge=t=>`<span class="badge ${tcls(t)}">${esc(t||"–")}</span>`;
const isoToday=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dlabel=iso=>new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
function toast(msg,ms=3500){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ms)}

/* ------------------------------------------------------------------ GitHub API */
function b64encode(str){const bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64decode(b64){const bin=atob(b64.replace(/\n/g,""));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
async function gh(path,opts={}){
  const c=S.conn;const url=`https://api.github.com/repos/${c.owner}/${opts.repo||repoOf(S.who)}${path}`;
  const {repo:_r,...o2}=opts;opts=o2;
  const r=await fetch(url,{cache:"no-store",...opts,headers:{"Authorization":`Bearer ${c.token}`,"X-GitHub-Api-Version":"2022-11-28",Accept:"application/vnd.github+json",...(opts.headers||{})}});
  if(!r.ok){const t=await r.text();const e=new Error(`GitHub ${r.status}: ${t.slice(0,200)}`);e.status=r.status;throw e}
  return r;
}
async function getFile(p,repo){const r=await gh(`/contents/${p}?ref=${S.conn.branch}`,{repo});const j=await r.json();
  let text=j.content?b64decode(j.content):"";
  if(!j.content&&j.size>0){text=await (await gh(`/contents/${p}?ref=${S.conn.branch}`,{repo,headers:{Accept:"application/vnd.github.raw+json"}})).text()}
  return {text,sha:j.sha}}
async function getRaw(p){return (await gh(`/contents/${p}?ref=${S.conn.branch}`,{headers:{Accept:"application/vnd.github.raw+json"}})).text()}
async function putFile(p,text,sha,msg,repo){
  const body={message:msg,content:b64encode(text),branch:S.conn.branch};if(sha)body.sha=sha;
  const r=await gh(`/contents/${p}`,{method:"PUT",body:JSON.stringify(body),repo});return (await r.json()).content.sha}
async function sha(p){const r=await gh(`/contents/${p}?ref=${S.conn.branch}`);return (await r.json()).sha}

/* ------------------------------------------------------------------ CSV */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const head=rows.shift()||[];return {head,rows:rows.filter(r=>r.length>1||r[0]!=="").map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??""])))}}
function toCSV(head,rows){const q=v=>{v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return head.join(",")+"\r\n"+rows.map(r=>head.map(h=>q(r[h])).join(",")).join("\r\n")+(rows.length?"\r\n":"")}
/* read-modify-write with retry on a concurrent change */
async function editCSV(path,fn,msg){
  for(let attempt=0;attempt<3;attempt++){
    const {text,sha:s}=await getFile(path);const t=parseCSV(text);const rows=fn(t.rows,t.head);
    try{await putFile(path,toCSV(t.head,rows),s,msg);return}catch(e){if(e.status!==409&&e.status!==422)throw e}
  }throw new Error("The file changed while saving. Please try again.")}

/* ------------------------------------------------------------------ data loading */
async function loadOut(who,force){
  if(S.out[who]&&!force)return S.out[who];
  const txt=await getRaw(`out/${who}.json`);S.out[who]=JSON.parse(txt);return S.out[who]}
let watch=null;
async function afterSave(what,msg){
  toast(msg||`${what} saved. The model is recalculating…`,5000);
  const who=S.who;const before=await sha(`out/${who}.json`).catch(()=>null);
  clearInterval(watch);let n=0;setStatus("Recalculating… (usually under a minute)");
  watch=setInterval(async()=>{n++;
    try{const now=await sha(`out/${who}.json`);if(now&&now!==before){clearInterval(watch);await loadOut(who,true);setStatus();render();toast("Updated with your new data")}}catch(e){}
    if(n>24){clearInterval(watch);setStatus("Still recalculating. Reload in a minute, or check the Actions tab of the model repository.")}},8000)}
// the newest of the app's own version and the version that last calculated the data (that one only changes when the
// rider's data is recalculated, so after a code update it can lag behind until the next run)
const vnum=v=>String(v||"0").split(".").map(Number);
const newer=(a,b)=>{const x=vnum(a),y=vnum(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)?a:b}return a};
function setStatus(extra){const o=S.out[S.who];$("#ver").textContent="v"+newer(APP_VERSION,o&&o.kairos_version);$("#status").textContent=(extra?extra+" · ":"")+(o?`Calculated ${new Date(o.generated).toLocaleString()}`:"")}

/* ------------------------------------------------------------------ shell */
function shell(){
  // only a master login (access to several people's repositories) gets the switch
  const order=S.me?[S.me,...S.athletes.filter(a=>a!==S.me)]:S.athletes;
  $("#who").innerHTML=S.conn&&S.athletes.length>1?order.map(a=>`<button data-who="${esc(a)}" class="${a===S.who?"on":""}">${esc(cap(a))}</button>`).join(""):"";
  $("#tabs").innerHTML=!S.conn?"":tabs().map(([k,l])=>`<button data-tab="${k}" class="${k===S.tab?"on":""}">${l}</button>`).join("");
}
document.addEventListener("click",e=>{
  const w=e.target.closest("[data-who]");if(w&&S.athletes.includes(w.dataset.who)){S.who=w.dataset.who;LS.set("who",S.who);shell();render();return}
  const t=e.target.closest("[data-tab]");if(t&&tabs().some(x=>x[0]===t.dataset.tab)){S.tab=t.dataset.tab;LS.set("tab",S.tab);shell();render();window.scrollTo(0,0);return}
});
async function render(){
  S.charts.forEach(c=>c.destroy());S.charts=[];
  const m=$("#main");
  if(!S.conn){m.innerHTML=connectView();bindConnect();return}
  if(!tabs().some(x=>x[0]===S.tab)){S.tab="today";shell()}
  m.innerHTML=`<div class="card muted">Loading…</div>`;
  let o;try{o=await loadOut(S.who)}catch(e){m.innerHTML=`<div class="card"><h2>Can't load the model</h2><p>${esc(e.message)}</p><p class="muted">Check the token, or log out and in again. If the repository is new, run its "Recalculate model" workflow once.</p></div>`+settingsConn();bindSettingsConn();return}
  $("#title").textContent=`${o.name}: ${tabs().find(t=>t[0]===S.tab)[1]}`;setStatus();
  const V={today:vToday,plan:vPlan,log:vLog,acts:vActs,trends:vTrends,model:vModel,workouts:vWorkouts,settings:vSettings,account:vAccount}[S.tab];
  await V(o,m);
  if(S.me&&S.who!==S.me){const mv=masterView();
    m.insertAdjacentHTML("afterbegin",`<div class="card small"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>You are looking at <b>${esc(o.name)}</b>'s pages. Anything you save here goes into ${esc(o.name)}'s data.</span><button class="btn ghost" style="white-space:nowrap" data-who="${esc(S.me)}">Back to mine</button></div>
     <div class="actions" style="margin-top:8px"><div class="seg" id="viewas"><button data-as="0" class="${mv?"on":""}">Master view</button><button data-as="1" class="${mv?"":"on"}">${esc(o.name)}'s view</button></div><span class="muted">${mv?"All tabs, including Model, Workouts and Settings.":`What ${esc(o.name)} sees.`}</span></div></div>`);
    m.querySelectorAll("#viewas [data-as]").forEach(b=>b.onclick=()=>{LS.set("asrider",b.dataset.as==="1");if(!tabs().some(x=>x[0]===S.tab)){S.tab="today";LS.set("tab","today")}shell();render()})}
}

/* ------------------------------------------------------------------ connect */
async function ghUser(token){const r=await fetch("https://api.github.com/user",{cache:"no-store",headers:{"Authorization":`Bearer ${token}`,"X-GitHub-Api-Version":"2022-11-28",Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error(r.status===401?"GitHub doesn't accept this token (expired or mistyped?)":`GitHub ${r.status}`);return (await r.json()).login}
function connectView(){return `<div class="card"><h2>Log in</h2>
<p>Paste your personal access token. It is stored only on this device and opens your own pages.</p>
<form id="cf"><div class="row"><label>Personal access token<input name="token" type="password" required autocomplete="off" placeholder="github_pat_…"></label></div>
<details><summary>Advanced</summary><div class="row"><label>Repository owner<input name="owner" placeholder="the token's GitHub account"></label><label>Branch<input name="branch" value="main"></label></div></details>
<button class="btn">Log in</button></form></div>`}
function bindConnect(){const f=$("#cf");if(!f)return;f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
  const token=d.token.trim();const btn=f.querySelector("button");btn.disabled=true;
  try{
    const login=await ghUser(token);
    S.conn={owner:(d.owner||"").trim()||login,branch:(d.branch||"main").trim(),token};
    const ok=[];
    for(const p of PEOPLE){try{await gh("",{repo:p.repo});ok.push(p.id)}catch(err){if(err.status!==404&&err.status!==403)throw err}}
    if(!ok.length)throw new Error(`This token can't reach any of the training repositories of ${S.conn.owner}. Check its repository access (or the owner under Advanced).`);

    LS.set("conn",S.conn);LS.set("athletes",ok);LS.set("master",master);LS.set("me",me);LS.set("who",me);LS.set("tab","today");shell();render();

  const C=J.cycle||{};
  let h=`<div class="card"><h2>${esc(J.name)}'s settings</h2><form id="sf">
   <div class="row">${SETF.map(([k,l,t])=>t==="focus"?`<label>${l}<select name="${k}">${["Marathon skating","XCO MTB","Both"].map(x=>`<option ${J[k]===x?"selected":""}>${x}</option>`).join("")}</select></label>`:`<label>${l}<input name="${k}" type="${t}" step="any" value="${esc(J[k]??"")}"></label>`).join("")}</div>
   <fieldset><legend>Heart-rate zones: lower bound as % of max HR (update after a test)</legend><div class="row">${[0,1,2,3,4].map(i=>`<label>Z${i+1} %<input name="hz${i}" type="number" step="any" value="${Math.round((J.hr_zones||[])[i]*100)}"></label>`).join("")}</div>
   <p class="small muted">Now: ${o.settings.hr_zones.map(z=>`${z.zone} ${z.from}-${z.to}`).join(" · ")} bpm (max HR ${o.dashboard.signals.maxhr})</p></fieldset>
   <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="balance_drills" style="width:auto" ${J.balance_drills?"checked":""}>Include pedal-balance drills</label>
   ${C.enabled!==undefined&&J.cycle&&("length" in C)?`<fieldset><legend>Cycle</legend><div class="row">
     <label>Cycle-aware planning<select name="c_enabled"><option value="1" ${C.enabled?"selected":""}>Yes</option><option value="0" ${!C.enabled?"selected":""}>No</option></select></label>
     <label>Strong/weak days<select name="c_mode"><option ${C.mode==="Auto"?"selected":""}>Auto</option><option ${C.mode==="Manual"?"selected":""}>Manual</option></select></label>
     <label>Average cycle length<input name="c_length" type="number" step="any" value="${C.length}"></label>
     <label>Strong days from-to<input name="c_strong" value="${(C.strong_days||[]).join("-")}"></label>
     <label>Weak days from-to<input name="c_weak" value="${(C.weak_days||[]).join("-")}"></label></div></fieldset>`:""}
   <div class="actions" style="margin-top:12px"><button class="btn">Save settings</button></div></form></div>
   <div class="card"><h2>Advanced: ${esc(CODE_REPO+"/"+path)}</h2><p class="small muted">Every value here overrides the shared defaults in config/defaults.json of the TrainingModel repository (weekly patterns, readiness weights, thresholds...).</p><textarea id="raw">${esc(JSON.stringify(J,null,2))}</textarea>
   <div class="actions" style="margin-top:8px"><button class="btn ghost" id="saveraw">Save JSON</button></div></div>`+settingsConn();
  m.innerHTML=h;bindSettingsConn();const dr=keepDraft($("#sf"),"settings");
  const save=async(obj,what)=>{try{
    await putFile(path,JSON.stringify(obj,null,2)+"\n",fsha,`Settings ${who}: ${what}`,CODE_REPO);
    // settings live in the code repository: ask the rider's repository to recalculate now
    await gh("/dispatches",{repo:repoOf(who),method:"POST",body:JSON.stringify({event_type:"model-updated"})}).catch(()=>{});
    dr.clear();afterSave("Settings")}catch(e){toast(e.message,6000)}};
  $("#sf").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    SETF.forEach(([k,,t])=>{if(d[k]!==undefined&&d[k]!=="")J[k]=t==="number"?+d[k]:d[k]});
    J.hr_zones=[0,1,2,3,4].map(i=>+d["hz"+i]/100);J.balance_drills=!!d.balance_drills;
    if(d.c_enabled!==undefined){J.cycle.enabled=d.c_enabled==="1";J.cycle.mode=d.c_mode;J.cycle.length=+d.c_length;
      const rg=v=>v.split("-").map(x=>+x.trim()).slice(0,2);J.cycle.strong_days=rg(d.c_strong);J.cycle.weak_days=rg(d.c_weak)}
    save(J,"form")};
  $("#saveraw").onclick=()=>{let obj;try{obj=JSON.parse($("#raw").value)}catch(e){toast("That isn't valid JSON: "+e.message,6000);return}save(obj,"JSON")};
}
async function vAccount(o,m){m.innerHTML=settingsConn();bindSettingsConn()}
function settingsConn(){const c=S.conn||{};return `<div class="card"><h2>Login (this device only)</h2><p class="small">Logged in as <b>${esc(cap(S.me)||"?")}</b>${S.master?" (master: sees "+esc(S.athletes.map(cap).join(", "))+")":""} · ${esc(c.owner)}/${esc(repoOf(S.who))} · branch ${esc(c.branch)} · Kairos v${esc((S.out[S.who]||{}).kairos_version||"?")} (model) · v${APP_VERSION} (app)</p>
  ${!S.master&&S.me===MASTER?`<p class="small" style="color:var(--warn)">This token can't open the ${esc(CODE_REPO)} repository, so Model, Workouts and Settings are hidden. On GitHub, edit the token: add ${esc(CODE_REPO)} under Repository access with Contents: Read and write, then tap Reload data.</p>`:""}
  <div class="actions"><button class="btn ghost" id="reload">Reload data</button><button class="btn ghost" id="theme">Theme: ${LS.get("theme","auto")}</button><button class="btn bad" id="logout">Log out</button></div></div>`}
function bindSettingsConn(){const r=$("#reload");if(r)r.onclick=()=>{S.out={};render();checkMaster()};
  const t=$("#theme");if(t)t.onclick=()=>{const n={auto:"light",light:"dark",dark:"auto"}[LS.get("theme","auto")];LS.set("theme",n);applyTheme();render()};
  const l=$("#logout");if(l)l.onclick=()=>{if(!confirm("Log out and forget the token on this device?"))return;try{["conn","me","who","athletes","master"].forEach(k=>localStorage.removeItem(k))}catch(e){}S.conn=null;S.me=null;S.master=false;S.athletes=[];S.out={};shell();render()}}
function applyTheme(){const t=LS.get("theme","auto");if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}

/* number fields: iPhone keypads in Dutch (and other) regions type "," as the decimal sign, which <input type=number>
   rejects. So every number field is a text field with the decimal keypad, and "," becomes "." on save. */
function fixNums(root){root.querySelectorAll('input[type="number"]').forEach(el=>{el.type="text";el.inputMode="decimal";el.classList.add("num");el.autocomplete="off"})}
new MutationObserver(()=>fixNums($("#main"))).observe($("#main"),{childList:true,subtree:true});
document.addEventListener("submit",e=>{const bad=[];
  e.target.querySelectorAll("input.num").forEach(el=>{const v=el.value.trim().replace(/\s/g,"").replace(",",".");el.value=v;
    if(v!==""&&!/^-?\d*\.?\d+$|^-?\d+\.$/.test(v))bad.push(el.closest("label")?.firstChild?.textContent?.trim()||el.name)});
  if(bad.length){e.preventDefault();e.stopPropagation();toast("Not a number: "+bad.join(", "),6000)}},true);

applyTheme();shell();render();
// master tabs are only shown while the token really reaches the code repository (localStorage can be edited)
// only a clear "no access" answer hides them; a network hiccup or rate limit keeps what the login found
function checkMaster(){if(!S.conn)return;gh("",{repo:CODE_REPO}).then(()=>true,err=>[401,403,404].includes(err.status)?false:S.master).then(m=>{if(m!==S.master){S.master=m;LS.set("master",m);if(!tabs().some(x=>x[0]===S.tab))S.tab="today";shell();render()}})}
$("#ver").textContent="v"+APP_VERSION;checkMaster();
</script>
